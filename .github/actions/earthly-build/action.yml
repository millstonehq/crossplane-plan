name: Build crossplane-plan
description: Build and test crossplane-plan using Earthly
inputs:
  earthly-target:
    description: 'Earthly target to build (e.g., +all, +publish)'
    required: false
    default: '+all'
  push:
    description: 'Whether to push images (adds --push flag)'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory containing the Earthfile (defaults to tools/crossplane-plan in mill, . in FOSS)'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    # BOTH OF THESE NEED A LOCAL DOCKER DAEMON, AND A SELF-HOSTED RUNNER HAS NONE.
    #
    # arc-runner-set/values.yaml refuses containerMode: dind because "it would grant privileged
    # execution to anything that can open a PR", so these pods have no /var/run/docker.sock. On
    # 2026-08-16 that made setup-buildx fail in under a second with "failed to connect to the
    # docker API", which then SKIPPED every later step including the build -- so the job reported
    # a docker error for a build that never ran.
    #
    # They are also pointless against a remote builder even where docker exists: earth talks to a
    # buildkitd on another machine, which has its own platform support, and QEMU registered on the
    # runner does nothing for it.
    #
    # GUARDED ON runner.environment, NOT ON env.EARTH_BUILDKIT_HOST, AND THE DIFFERENCE IS NOT
    # COSMETIC. The `env` context in an `if:` expression contains only variables declared in a
    # workflow/job/step `env:` block. EARTH_BUILDKIT_HOST is injected into the runner POD by
    # arc-runner-set/values.yaml, so a `run:` shell sees it and an `if:` expression does NOT --
    # `env.EARTH_BUILDKIT_HOST == ''` is therefore TRUE on the self-hosted runner and the step
    # executes exactly as before. A guard that silently never fires is worse than no guard,
    # because the next reader believes the case is handled.
    #
    # runner.environment is 'github-hosted' or 'self-hosted' and is supplied by the runner itself,
    # so it needs nothing declared anywhere. Hosted behaviour is unchanged and the
    # copybara-exported public repos, which have no shared buildkitd and genuinely need local
    # buildx, keep working exactly as before.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      if: runner.environment == 'github-hosted'

    - name: Set up QEMU for multi-platform builds
      uses: docker/setup-qemu-action@v3
      if: runner.environment == 'github-hosted'
      with:
        platforms: linux/amd64,linux/arm64

    - name: Download Earthly
      shell: bash
      run: |
        # PINNED AND ARCH-DETECTED. This was `releases/latest/.../earthly-linux-amd64`: a build
        # that changes under you, and an amd64 binary, which is an exec-format error on the arm64
        # runner pool these jobs are moving to. Both faults are invisible until the move.
        # The version matches earthbuild/buildkitd on both shared builders -- mismatched BuildKit
        # versions produce different cache keys, so client and daemon move together.
        # $HOME/.local/bin because the ARC runner image has no sudo; GITHUB_PATH does not affect
        # the step that writes it, so PATH is set here too. Installed as `earth` with an `earthly`
        # symlink, so ~60 existing call sites resolve without a rename in this change.
        EARTH_VERSION=v0.8.18
        case "$(uname -m)" in
          x86_64)        EARTH_ARCH=amd64 ;;
          aarch64|arm64) EARTH_ARCH=arm64 ;;
          *) echo "::error::unsupported machine $(uname -m)"; exit 1 ;;
        esac
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/earthbuild/earthbuild/releases/download/${EARTH_VERSION}/earth-linux-${EARTH_ARCH}" -o "$HOME/.local/bin/earth"
        chmod +x "$HOME/.local/bin/earth"
        ln -sf "$HOME/.local/bin/earth" "$HOME/.local/bin/earthly"
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # TLS OFF, BUT ONLY WHEN THERE IS A REMOTE BUILDKIT TO REACH. The shared buildkitds answer
        # on in-cluster DNS, not the public internet, and earth otherwise demands a CA at
        # ~/.earthly/certs -- failing by trying to start a LOCAL buildkitd via docker, which these
        # runner pods deliberately have no daemon for. Guarded on the variable so a GitHub-hosted
        # run, which uses a local buildkitd with its own generated certs, is left alone. The
        # variable is set on every runner pod by arc-runner-set/values.yaml, so moving a workflow
        # to self-hosted needs no change here beyond `runs-on:`.
        if [ -n "${EARTH_BUILDKIT_HOST:-}" ]; then earthly config global.tls_enabled false; fi
        earthly --version

    - name: Build with Earthly
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORCE_COLOR: 1
      run: |
        PUSH_FLAG=""
        # REMOTE CACHE ONLY WHERE THERE IS NO PERSISTENT BUILDKITD, WHICH MEANS NOT IN mill.
        #
        # docs/superpowers/plans/2026-08-15-self-hosted-buildkit-multiarch.md decided this:
        # "Drops --remote-cache: it pushed the intermediate layer graph to GHCR on every build,
        # which is a GitHub dependency in the place we most wanted independence, and redundant
        # against a persistent buildkitd PVC."
        #
        # MEASURED 2026-08-24, and the PVC alone is enough. The first green provider build since
        # 2026-08-17 took 1h05m cold. The very next one, off local cache only, took 3m12s. The
        # remote tag was six months stale and contributed nothing to either.
        #
        # THIS ACTION RUNS IN TWO PLACES, WHICH IS WHY IT IS A GUARD AND NOT A DELETION. In mill
        # it runs on mill-arm64 against a shared buildkitd with a 40Gi cache PVC and a 30-day
        # keepDuration. Copybara exports it to a PUBLIC repo where the same steps run on
        # GitHub-hosted runners that are ephemeral and have no buildkitd to keep anything -- there
        # the remote cache is the only cache there is. Same reasoning, and the same
        # runner.environment test, as the buildx/QEMU steps above.
        if [ "${{ runner.environment }}" = "github-hosted" ]; then
          CACHE_FLAGS="--remote-cache=ghcr.io/millstonehq/cache:crossplane-plan --max-remote-cache"
        else
          CACHE_FLAGS=""
        fi

        if [ "${{ inputs.push }}" == "true" ]; then
          PUSH_FLAG="--push"
        fi

        earthly --ci $PUSH_FLAG $CACHE_FLAGS ${{ inputs.earthly-target }}
